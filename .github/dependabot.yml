# .github/dependabot.yml -- weekly pull requests that bump the pinned versions, so pinning
# (Docker tags, package-lock.json) does not turn into running outdated software.
# backend/requirements.lock is regenerated by hand (see its header) after a requirements.txt bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/nginx", "/docker/tunnel"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
