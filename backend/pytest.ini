[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Isolated in-memory unit and mock tests
    guards: Project rules checked on source and config files
    live: Tests running against real cloned PostgreSQL database
    workflow: Multi-step end-to-end user workflow tests
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning