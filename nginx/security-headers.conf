# nginx/security-headers.conf -- browser security headers for the site's server blocks.
# Included at *server* level. nginx drops every server-level add_header in a location that
# declares its own add_header, so locations must not use add_header (put headers here instead).
# `always` sends them on error pages too (403 bot filter, 429 rate limit, 5xx).

# The backend already sets nosniff on its responses; hide its copy so the header is sent once.
proxy_hide_header X-Content-Type-Options;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The site uses the microphone (speech features); everything else stays off.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=(), browsing-topics=()" always;

# Enforced now: nothing may frame the site, inject a <base> or load plugins.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
# The full policy is report-only until the browser console shows no violations in normal use;
# then move it into the enforced header above. 'unsafe-inline' covers Next.js inline bootstrap
# scripts; 'unsafe-eval' and the jsDelivr / Hugging Face origins are the in-browser speech model;
# :8117 is the Umami tracker; accounts.google.com is Google sign-in.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://accounts.google.com https://*:8117; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://accounts.google.com https://*:8117; media-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
