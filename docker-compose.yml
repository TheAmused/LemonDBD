# docker-compose.yml
services:
  db:
    image: postgres:alpine
    container_name: dbd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbd_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbd_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dbd_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbd_backend
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - backend_data:/app/data
      - ./backend/app/static:/app/app/static
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-dbd-lemon-2026}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/dbd_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dbd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
    container_name: dbd_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dbd_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dbd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - dbd_network

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local
  backend_static:
    driver: local

networks:
  dbd_network:
    driver: bridge