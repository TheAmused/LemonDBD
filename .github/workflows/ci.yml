# .github/workflows/ci.yml -- runs on every push and pull request.
# Backend: ruff, unit tests, and the live suite against a real Postgres service.
# Frontend: unit tests and the production build. Not here: the frontend live suite and the rendered
# checks (they need the whole running stack: `up -Strict` locally) and k6.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install dependencies (hash-checked, as in the image)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: ruff (unused imports and variables, undefined names; config in ruff.toml)
        run: ruff check .
      - name: pytest (unit)
        run: python -m pytest tests/unit -q -n auto

  backend-live:
    # The unit suite runs on in-memory SQLite. This job runs the live suite on the same Postgres
    # major version as docker-compose.base.yml, so JSONB, locking, constraint and migration
    # behaviour is checked on every push, not only by a local `up -Strict`.
    name: Backend live tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbd_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbd_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbd_db
      # development turns on the demo accounts (lemon / user) that the auth workflows sign in with.
      FLASK_ENV: development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install dependencies (hash-checked, as in the image)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Migrate and seed dbd_db (what the container entrypoint does on first boot)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dbd_db
          SECRET_KEY: ci-only-secret-key-0123456789abcdefghij
          JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdefghij
          SCHEDULER_ENABLED: "false"
        run: python scripts/sync_db_schema.py
      - name: pytest (live, against a template copy of dbd_db)
        run: python -m pytest tests/live -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # No separate type-check, lint or i18n/style steps: `npm run build` below runs the lint
      # (prebuild) and Next's type-check, and `npm test` runs the unit tests plus the guard suites
      # (the i18n, style and typography scans and the lint-suppression guard among them).
      - name: Compose env for the docker guard test
        # dockerGuards.test.ts validates the prod compose file, which needs .env.prod and the
        # required passwords. Throwaway values, never used to run anything.
        working-directory: .
        run: |
          cp .env.example .env.prod
          sed -i -E 's/^(POSTGRES_PASSWORD|UMAMI_APP_SECRET|PGADMIN_DEFAULT_PASSWORD|UMAMI_ADMIN_PASSWORD)=\r?$/\1=ci-only/' .env.prod
      - name: Unit tests and guards
        run: npm test
      - name: Production build (lint, type-check, build, built-output check)
        run: npm run build
