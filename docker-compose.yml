# docker-compose.yml
services:
  db:
    image: postgres:alpine
    container_name: dbd_db
    restart: unless-stopped
    # Bumped from the postgres:alpine default (100) -- the backend's pool
    # (pool_size + max_overflow, per gunicorn worker) plus umami/pgadmin can
    # otherwise exhaust connections under the live/frontend test suite's
    # concurrent load, causing Postgres to drop connections mid-query
    # ("server closed the connection unexpectedly") and 500s on the backend.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbd_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbd_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dbd_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbd_backend
    restart: "no"
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_data:/app/data
      - ./backend/app/static:/app/app/static
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      # More headroom than gunicorn.conf.py's production default (2/4) --
      # the live/frontend test suite throws a lot of concurrent requests at
      # this stack locally, which otherwise queues through too few worker
      # slots and can starve the DB pool. Override with real values in your
      # environment/.env for an actual production deployment.
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-8}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-dbd-lemon-2026}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/dbd_db}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
      # Dev/test-vs-production feature toggles -- see .env.development /
      # .env.production. All three default "on" (production-safe) when unset,
      # so a bare `docker compose up` with no .env still behaves safely.
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED:-true}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - INITIAL_SCRAPE_ENABLED=${INITIAL_SCRAPE_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - dbd_network

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: dbd_umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-this-to-a-random-secret-in-production}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/heartbeat').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 15s
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbd_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dbd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lemondbd.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_PGADMIN_URL: ${NEXT_PUBLIC_PGADMIN_URL:-https://localhost:5050}
    container_name: dbd_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-}
      - UMAMI_PUBLIC_URL=${NEXT_PUBLIC_UMAMI_URL:-}
      - NEXT_PUBLIC_PGADMIN_URL=${NEXT_PUBLIC_PGADMIN_URL:-https://localhost:5050}
      # /api/umami-config (frontend/src/app/api/umami-config/route.ts)
      # self-provisions the Umami website over the internal Docker network
      # the first time anyone loads a page -- no separate container, no
      # separate script, nothing to paste in by hand, and it self-heals on
      # every `docker compose down -v` reset. These just point it at Umami
      # and give it Umami's default admin login.
      - UMAMI_INTERNAL_URL=http://umami:3000
      - UMAMI_ADMIN_USERNAME=${UMAMI_ADMIN_USERNAME:-admin}
      - UMAMI_ADMIN_PASSWORD=${UMAMI_ADMIN_PASSWORD:-umami}
      - UMAMI_SITE_NAME=${UMAMI_SITE_NAME:-LemonDBD}
      - UMAMI_SITE_DOMAIN=${UMAMI_SITE_DOMAIN:-localhost}
    depends_on:
      backend:
        condition: service_healthy
      umami:
        condition: service_started
    networks:
      - dbd_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dbd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${UMAMI_PORT:-8117}:8117"
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      umami:
        condition: service_started
      pgadmin:
        condition: service_started
    networks:
      - dbd_network

  # Production-only WAF/IP-ban layer -- reads live nginx access logs and bans
  # abusive IPs. Actively unhelpful in local dev/test: it "learns" from the
  # live/frontend test suite's rapid concurrent requests and can start
  # banning your own test traffic. Gated behind the "prod" Compose profile
  # so it's skipped by a plain `docker compose up` and only runs with
  # `docker compose --profile prod up`.
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: dbd_crowdsec
    restart: unless-stopped
    profiles:
      - prod
    environment:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      GID: "1000"
    volumes:
      - ./docker/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - nginx_logs:/var/log/nginx:ro
    networks:
      - dbd_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_data:
    driver: local
  backend_static:
    driver: local
  nginx_logs:
    driver: local
  crowdsec_data:
    driver: local
networks:
  dbd_network:
    driver: bridge
