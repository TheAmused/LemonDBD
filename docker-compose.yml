# docker-compose.yml
services:
  db:
    image: postgres:alpine
    container_name: dbd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbd_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbd_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dbd_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbd_backend
    restart: "no"
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_data:/app/data
      - ./backend/app/static:/app/app/static
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-dbd-lemon-2026}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/dbd_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 4s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - dbd_network

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: dbd_umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-this-to-a-random-secret-in-production}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbd_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dbd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lemondbd.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_PGADMIN_URL: ${NEXT_PUBLIC_PGADMIN_URL:-https://localhost:5050}
    container_name: dbd_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-}
      - NEXT_PUBLIC_PGADMIN_URL=${NEXT_PUBLIC_PGADMIN_URL:-https://localhost:5050}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dbd_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dbd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${UMAMI_PORT:-8117}:8117"
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      umami:
        condition: service_started
      pgadmin:
        condition: service_started
    networks:
      - dbd_network

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: dbd_crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      GID: "1000"
    volumes:
      - ./docker/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - nginx_logs:/var/log/nginx:ro
    networks:
      - dbd_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_data:
    driver: local
  backend_static:
    driver: local
  nginx_logs:
    driver: local
  crowdsec_data:
    driver: local

networks:
  dbd_network:
    driver: bridge