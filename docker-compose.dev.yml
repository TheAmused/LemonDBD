# docker-compose.dev.yml - Development overlay for LemonDBD
# Both files are merged as one project and interpolated from .env.dev. Keep services in
# docker-compose.dev-services.yml: anything written in THIS file does not see .env.dev.
include:
  - path:
      - docker-compose.base.yml
      - docker-compose.dev-services.yml
    env_file: .env.dev
