# Rate Limiting & Connection Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=120r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# Bad Bot / Malicious Crawler Map
map $http_user_agent $bad_bot {
    default 0;
    ~*(sqlmap|nikto|masscan|zgrab|nmap|morfeus|gobuster|dirbuster|wpscan|censys) 1;
    ~*(bytespider|gptbot|ccbot|semrushbot|ahrefsbot|petalbot|dotbot) 1;
}

# Buffer & Timeout Optimization
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_max_body_size 20M;

client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 10s;

# Logging
access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log;

# 1. HTTP Server (Port 80)
# For localhost: serve normally (Web Speech API works on http://localhost)
# For non-localhost (production IP/domain): redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Connection limit
    limit_conn addr_limit 30;

    # Bad bot check
    if ($bad_bot = 1) {
        return 403 '{"error": "Forbidden", "message": "Access blocked by bot filter"}';
    }

    # Custom 429 JSON error handler
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please wait a moment before trying again."}';
    }

    # Sensitive Auth and Bug Report routes (Aggressive Rate Limiting)
    location ~ ^/api/v1/(auth/login|auth/register|auth/forgot-password|auth/reset-password|bug-reports) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Standard API endpoints
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Static assets (including user avatars and icons)
    location /static/ {
        limit_req zone=static_limit burst=180 nodelay;
        proxy_pass http://backend:5000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # Next.js Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Catch-all HTTP server — redirect any non-localhost HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# 3. HTTPS Server (Port 443) — available for production / secure context
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Connection limit
    limit_conn addr_limit 30;

    # Bad bot check
    if ($bad_bot = 1) {
        return 403 '{"error": "Forbidden", "message": "Access blocked by bot filter"}';
    }

    # Custom 429 JSON error handler
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please wait a moment before trying again."}';
    }

    # Sensitive Auth and Bug Report routes (Aggressive Rate Limiting)
    location ~ ^/api/v1/(auth/login|auth/register|auth/forgot-password|auth/reset-password|bug-reports) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Standard API endpoints
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Static assets
    location /static/ {
        limit_req zone=static_limit burst=180 nodelay;
        proxy_pass http://backend:5000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # Next.js Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 4. Umami analytics dashboard + tracking script/collect endpoint.
# Served on its own port rather than a subpath of the main site: the
# Umami image doesn't honor a BASE_PATH env var, so its internal links and
# _next/static asset paths are always absolute from "/" -- proxying it
# under a path prefix on the main domain breaks those references. A
# dedicated port keeps it working exactly as Umami itself expects, at the
# small cost of one extra published port.
server {
    listen 8117 ssl;
    listen [::]:8117 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://umami:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 5. pgAdmin 4 PostgreSQL database management web dashboard.
# Served on dedicated SSL port 5050 (like Umami on 8117).
server {
    listen 5050 ssl;
    listen [::]:5050 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://pgadmin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 5050;
        proxy_redirect off;
    }
}
